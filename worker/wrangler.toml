name = "prashast-lab-ai"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Public, non-secret settings. The OpenAI key is NOT set here: run
#   npx wrangler secret put OPENAI_API_KEY
[vars]
ALLOWED_ORIGINS = "https://prashastvats1.github.io"
OPENAI_MODEL = "gpt-6-luna"

# Per visitor and instrument, per Cloudflare location: 6 analyses a minute.
[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "5101"

  [ratelimits.simple]
  limit = 6
  period = 60
