name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install
      - name: Build
        run: npm run build
        env:
          # Public URL of the AI Worker (a repository variable, not a secret). Never put an API key in a REACT_APP_ variable.
          REACT_APP_AI_API_URL: ${{ vars.AI_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/
      - uses: actions/deploy-pages@v4
